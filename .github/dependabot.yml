version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # One PR for the whole CodeQL action set: init, analyze, autobuild and
    # upload-sarif must always run the same version. Since CodeQL Action
    # 3.30.4 the non-init steps hard-error when they load a configuration
    # file written by a different version, so a half-applied bump breaks the
    # scan rather than merely warning.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "docker"
    directory: "/relay"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

# Not covered by any entry above, because Dependabot has no ecosystem for these
# pins. Renovate's default `pyenv` and `github-actions` managers proposed bumps to
# them until renovate.json was scoped to the standards bump (#342). They are now
# a manual check:
#   - `.python-version` (the local / uv interpreter), when adopting a new Python
#     minor
#   - the `version:` input to astral-sh/setup-uv in ci.yml, a11y.yml,
#     release.yml and tsa-integration.yml, which pins the uv release CI installs
