name: codeql

# CICD-§11e: PRs into main + the weekly schedule cover everything a push:main
# trigger would — the PR run analyzes the change before merge, the schedule
# keeps default-branch results fresh against new queries. No push trigger.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1" # weekly, Monday 04:37 UTC

permissions:
  contents: read

# CICD-§11c: a force-push to a PR branch supersedes the in-flight analysis;
# cancel it rather than paying for both.
concurrency:
  # CI-CD-STANDARD.md 11c. One group per commit on a push, one per branch on a
  # pull request. A concurrency group holds one *running* run and exactly one
  # *pending* run; a third arrival evicts the pending one with zero jobs ever
  # dispatched. So a ref-only key makes every push to `main` compete for one
  # slot, and a burst of merges deletes the verdict for whichever commit was
  # waiting -- not a failure anyone can see, an absence. `cancel-in-progress`
  # neither causes nor prevents that; it only decides whether the loss is
  # visible (cancelled with jobs) or invisible (cancelled with zero jobs).
  # Carrying the SHA gives each commit its own slot; PR supersession is
  # unchanged, because pull requests still share a per-ref group.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # P1-3 (CICD-19/20): `actions` scans the workflow YAML itself — a
        # different query/engine surface than zizmor — alongside the existing
        # `python` analysis of the application code.
        include:
          - language: python
            queries: security-extended
          - language: actions
            queries: "" # security-extended is not a published suite for `actions`; use defaults
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: ${{ matrix.queries }}
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
