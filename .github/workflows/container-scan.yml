# SPDX-License-Identifier: AGPL-3.0-or-later
name: container-scan

# Builds the optional ciphertext-only sync relay image and scans it for known
# OS/library CVEs with Trivy. The relay carries no third-party dependencies, so
# any finding here comes from the base image — keeping it on the gate means a
# newly-disclosed CVE in python:slim blocks the merge (and the weekly run catches
# CVEs disclosed against an already-merged image). Threshold is CRITICAL,HIGH per
# docs/standards/SECURITY-AND-SUPPLY-CHAIN-STANDARD.md §6.3, with no ignore file:
# a finding is cleared by patching it, not by waiving it.
#
# The image applies Debian security updates over its pinned base digest, so a
# finding clears on the next build once Debian publishes a fix, without waiting
# for upstream to rebuild python:slim. That is not optional tidiness — see
# relay/Dockerfile: as of 2026-08-17 the newest published python:3.14-slim digest
# still shipped a util-linux fixed in Debian, so a digest bump alone could not
# clear it.
#
# What the gate does NOT do, stated plainly because this comment used to imply
# the opposite: `ignore-unfixed: true` means a CVE Debian has not fixed is not
# reported by the gating step at all. It is not a block, and it never prompts
# the base change an earlier revision of this comment prescribed — it is
# invisible. The flag matches
# docs/standards/SECURITY-AND-SUPPLY-CHAIN-STANDARD.md §6.3, which specifies
# `--ignore-unfixed`, and it stays: a gate that reddens on a CVE nobody can
# patch blocks every merge until an upstream that does not answer to this
# project acts.
#
# So the unfixed set is *reported* instead, by a second step that is explicitly
# labelled as reporting and deliberately cannot fail. That is not a gate and is
# not counted as one; it exists so the base-change judgment has an input rather
# than resting on a sentence in a comment. Whether any of it should become
# blocking is a call for the owner, with the list in hand.

# CICD-§11e: the PR run gates the merge and the weekly schedule catches CVEs
# disclosed after merge — a push:main run would rebuild and rescan the identical
# image minutes after its PR run, so it carries no additional signal.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # weekly, Monday 04:41 UTC (DB-freshness re-scan)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # CI-CD-STANDARD.md 11c. One group per commit on a push, one per branch on a
  # pull request. A concurrency group holds one *running* run and exactly one
  # *pending* run; a third arrival evicts the pending one with zero jobs ever
  # dispatched. So a ref-only key makes every push to `main` compete for one
  # slot, and a burst of merges deletes the verdict for whichever commit was
  # waiting -- not a failure anyone can see, an absence. `cancel-in-progress`
  # neither causes nor prevents that; it only decides whether the loss is
  # visible (cancelled with jobs) or invisible (cancelled with zero jobs).
  # Carrying the SHA gives each commit its own slot; PR supersession is
  # unchanged, because pull requests still share a per-ref group.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  scan:
    name: Trivy image scan (relay)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx with an archive-capable builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the relay image
        # --no-cache is load-bearing now that the image applies Debian security
        # updates at build time: a cached `apt-get upgrade` layer would let Trivy
        # scan a package set captured from some earlier archive state and report
        # it as today's. Hosted runners start cold, so this costs a few seconds
        # and removes the assumption rather than relying on it.
        run: docker build --no-cache -f relay/Dockerfile -t habitable-relay:scan .
      - name: Verify byte-identical relay OCI rebuilds
        run: make relay-repro
      - name: Scan the image (Trivy — fail on HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: habitable-relay:scan
          severity: HIGH,CRITICAL
          # Per SECURITY-AND-SUPPLY-CHAIN-STANDARD §6.3. The findings this drops
          # are surfaced by the reporting step below, which cannot fail.
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          format: table
      # Reporting, not a gate. `exit-code: 0` is the whole point: these are CVEs
      # with no available fix, so failing on them would block every merge on an
      # upstream this project does not control. Listing them is what the header
      # comment's "the answer is a base change" needs in order to be actionable
      # — before this step, that sentence described a decision nobody had the
      # input for, because the gating scan never printed the findings it was
      # deciding about.
      - name: Report unfixed HIGH/CRITICAL CVEs (never fails)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: habitable-relay:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          vuln-type: os,library
          format: table
