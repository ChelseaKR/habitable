# SPDX-License-Identifier: AGPL-3.0-or-later
name: i18n

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-${{ github.ref }}
  # Cancel a superseded run on a pull-request branch, where only the latest
  # commit matters -- but never on `main`, where every commit is a protected
  # commit entitled to its own verdict. Cancelling there loses the verdict
  # entirely rather than deferring it: `e59c84d` (PR #213) landed with all
  # three of ci, i18n and a11y cancelled, and shipped a gate that could not
  # fail with nothing having checked it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    name: mechanical i18n gates — UTF-8 · BCP 47 · EN/ES parity (merge gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # These checkers are standard-library only and offline, so no dependency
      # install or uv sync is needed — the runner's built-in python3 suffices.
      # They mirror `make verify`'s `i18n` target byte-for-byte (no local/CI drift).
      - name: G1 — UTF-8 encoding of all tracked text files
        run: python3 scripts/check_i18n_utf8.py
      - name: G3 — BCP 47 validity of every authored language tag
        run: python3 scripts/check_bcp47.py
      - name: G6 — EN/ES bundle key-parity
        run: python3 scripts/check_i18n_parity.py
      # The job name is a required check in the branch ruleset, so it is left
      # alone; G9 is added as a step inside it rather than as a new context.
      - name: G9 — pseudo-locale generates and fits the compact chrome
        run: python3 scripts/check_pseudo_locale.py
