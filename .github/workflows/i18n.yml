# SPDX-License-Identifier: AGPL-3.0-or-later
name: i18n

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # CI-CD-STANDARD.md 11c. One group per commit on a push, one per branch on a
  # pull request. A concurrency group holds one *running* run and exactly one
  # *pending* run; a third arrival evicts the pending one with zero jobs ever
  # dispatched. So a ref-only key makes every push to `main` compete for one
  # slot, and a burst of merges deletes the verdict for whichever commit was
  # waiting -- not a failure anyone can see, an absence. `cancel-in-progress`
  # neither causes nor prevents that; it only decides whether the loss is
  # visible (cancelled with jobs) or invisible (cancelled with zero jobs).
  # Carrying the SHA gives each commit its own slot; PR supersession is
  # unchanged, because pull requests still share a per-ref group.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  gates:
    name: mechanical i18n gates — UTF-8 · BCP 47 · EN/ES parity (merge gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # These checkers are standard-library only and offline, so no dependency
      # install or uv sync is needed — the runner's built-in python3 suffices.
      # They mirror `make verify`'s `i18n` target byte-for-byte (no local/CI drift).
      - name: G1 — UTF-8 encoding of all tracked text files
        run: python3 scripts/check_i18n_utf8.py
      - name: G3 — BCP 47 validity of every authored language tag
        run: python3 scripts/check_bcp47.py
      - name: G5/G6 — EN/ES completeness, placeholder/plural parity and key-parity
        run: python3 scripts/check_i18n_parity.py
      # The job name is a required check in the branch ruleset, so it is left
      # alone; G9 is added as a step inside it rather than as a new context.
      - name: G9 — pseudo-locale generates and fits the compact chrome
        run: python3 scripts/check_pseudo_locale.py
