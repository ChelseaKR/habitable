# SPDX-License-Identifier: AGPL-3.0-or-later
# Scheduled full-history secret scan (SEC-17/18/19, third of three gates: CI diff
# gate in ci.yml, pre-commit gate in .pre-commit-config.yaml, and this one).
#
# The CI diff gate only ever sees the commits in a single push/PR; a secret
# committed further back in history and later removed would never trip it. This
# job walks the *entire* history weekly and fails loudly (job failure + GitHub
# Actions' own scheduled-run failure notification).
name: secret-scan-scheduled

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog-full-history:
    name: TruffleHog full-history scan (all reported tiers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TruffleHog over the full git history
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          # `path` is what makes this a whole-repository scan. Omitting base and
          # head does NOT fall back to scanning everything, which is what the
          # previous comment here assumed: with all three unset the action
          # resolves base and head to the same commit and exits 1 on its own
          # guard, "BASE and HEAD commits are the same. TruffleHog won't scan
          # anything." Every scheduled run since this workflow was added failed
          # that way, reporting failure while covering zero commits.
          path: ./
          # Lob is excluded because its detector matches this repo's pytest
          # function names. A Lob key is `test_` or `live_` followed by
          # alphanumerics, which is also the shape of every test in tests/, and
          # Lob's verifier confirms them because it cannot distinguish a
          # malformed key from an unauthorized one. The first run that actually
          # scanned reported 37 of these, all function names, all from tests/.
          # There is no Lob integration in this repo. Scoped to the one detector
          # rather than excluding tests/ by path, because fixtures are where a
          # real credential is most likely to be committed by accident.
          #
          # `--no-update` is not passed. The action's own command already
          # includes it, and repeating a flag is a hard CLI error
          # ("flag 'no-update' cannot be repeated"). Same for `--fail`.
          #
          # --results=verified,unknown,unverified. This job ran with
          # `--results=verified` until 2026-09-06, which is the one setting a
          # full-history scan must not have. TruffleHog sorts a candidate three
          # ways: `verified` (it authenticated against the live service),
          # `unverified` (it asked, and the service said no) and `unknown` (it
          # could not ask). A credential that was committed and later revoked
          # comes back `unverified` -- the revocation is exactly what makes the
          # provider say no -- and a cleaned-up leak is the case this scheduled
          # scan exists for. Reporting only `verified` could not fail on it.
          #
          # Measured 2026-09-06 on a throwaway clone with a real-shaped (not
          # vendor-example) AWS key planted in one commit and deleted in the
          # next, confirmed present in history and absent at HEAD:
          #
          #   --results=verified                     exit 0,   0 reported
          #   --results=verified,unknown             exit 0,   0 reported
          #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
          #
          # The widening was measured here before it was made, rather than
          # assumed cheap: this repository's full history (4,393 chunks, 7.0 MB
          # on origin/main) reports zero findings under all three tiers with the
          # Lob exclusion above, so nothing needed allowlisting. If a placeholder
          # fixture ever does fire, exclude that detector by name -- as Lob
          # already is -- rather than narrowing back to a tier.
          extra_args: --results=verified,unknown,unverified --exclude-detectors=Lob
