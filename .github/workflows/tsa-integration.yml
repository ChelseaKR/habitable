# SPDX-License-Identifier: AGPL-3.0-or-later
name: tsa-integration

on:
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tsa:
    name: stamp + verify against real public RFC 3161 authorities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Lockfile drift (CQ-09)
        # Must precede `uv sync` and any `uv run`: `--frozen` installs from uv.lock
        # without reading pyproject.toml and exits 0 on a drifted lock, and a bare
        # `uv run` silently relocks, repairing the drift a later check would look for.
        run: uv lock --check
      - name: Sync environment
        run: uv sync --frozen
      - name: Stamp + verify against public TSAs (only a hash is sent, never content)
        run: make integration
