# SPDX-License-Identifier: AGPL-3.0-or-later
# Workflow-security scanning (P1-3, CICD-19/20, SEC-04): lints the workflow
# YAML itself for injection risk, over-broad permissions, unpinned actions,
# etc. Blocks on High/Critical findings; results also upload to the Security
# tab (GitHub Advanced Security / code scanning, free for public repos).
name: zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # CI-CD-STANDARD.md 11c. One group per commit on a push, one per branch on a
  # pull request. A concurrency group holds one *running* run and exactly one
  # *pending* run; a third arrival evicts the pending one with zero jobs ever
  # dispatched. So a ref-only key makes every push to `main` compete for one
  # slot, and a burst of merges deletes the verdict for whichever commit was
  # waiting -- not a failure anyone can see, an absence. `cancel-in-progress`
  # neither causes nor prevents that; it only decides whether the loss is
  # visible (cancelled with jobs) or invisible (cancelled with zero jobs).
  # Carrying the SHA gives each commit its own slot; PR supersession is
  # unchanged, because pull requests still share a per-ref group.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor workflow security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # to upload SARIF to the Security tab
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor (blocking on High/Critical)
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          min-severity: high
