# SPDX-License-Identifier: AGPL-3.0-or-later
# Workflow-security scanning (P1-3, CICD-19/20, SEC-04): lints the workflow
# YAML itself for injection risk, over-broad permissions, unpinned actions,
# etc. Blocks on High/Critical findings; results also upload to the Security
# tab (GitHub Advanced Security / code scanning, free for public repos).
name: zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

# CICD-§11c: cancel superseded runs on the same ref.
concurrency:
  group: zizmor-${{ github.ref }}
  # Cancel a superseded run on a pull-request branch, where only the latest
  # commit matters -- but never on `main`, where every commit is a protected
  # commit entitled to its own verdict. Cancelling there loses the verdict
  # entirely rather than deferring it: `e59c84d` (PR #213) landed with all
  # three of ci, i18n and a11y cancelled, and shipped a gate that could not
  # fail with nothing having checked it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zizmor:
    name: zizmor workflow security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # to upload SARIF to the Security tab
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor (blocking on High/Critical)
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          min-severity: high
