# SPDX-License-Identifier: AGPL-3.0-or-later
# Local pre-commit gate, mirroring the CI merge gate so problems are caught
# before a push, not after. Install with:
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
#
# All hooks are pinned to a full commit SHA (not just a tag), same discipline
# as the SHA-pinned GitHub Actions in .github/workflows/.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      - id: end-of-file-fixer
        # These generated bytes are signature/reproducibility fixtures; rewriting
        # their EOF is a content change, not harmless text normalization.
        #
        # The golden half is a directory pattern rather than an enumeration of
        # version numbers. The list used to read `packet-v[123]`, so `packet-v4`,
        # `scoped-packet-v3` and every fixture committed after it were unprotected:
        # each one's `bundle.json` ends in `}` with no trailing newline, so the
        # first commit that restaged one would have appended a byte and broken the
        # signature the fixture exists to prove. Nothing caught it because a
        # fixture is written once and never touched again -- the enumeration only
        # fails on the day someone needs it.
        exclude: '^(tests/golden/[^/]+/bundle(\.sig)?\.json|site/sample-packet/(bundle(\.sig)?\.json|packet\.html))$'
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
        # Same reason as `end-of-file-fixer` above, and the same shape of near
        # miss. A packet's `bundle.json` records the SHA-256 of every file beside
        # it, so rewriting one byte of committed evidence is a content change that
        # makes the fixture fail its own verifier. CRLF is not incidental in these
        # files: it is *mandatory* in an RFC 5322 header block, and this hook
        # silently rewrote both sealed messages in the correspondence fixture on
        # the commit that added them (issue #304).
        #
        # A directory pattern, not an enumeration, for the reason the comment
        # above records: `packet-v[123]` went stale the day `packet-v4` landed,
        # and an enumeration only fails on the day someone needs it.
        exclude: '^(tests/golden/|site/sample-packet/)'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c59bba8fb259db0fec2bbb77ad8ba51ea7341b56 # v0.15.20
    hooks:
      # Scoped to src/ + tests/ only. This is deliberately NARROWER than
      # `make lint`, whose path list is the authority -- read `RUFF_PATHS` in the
      # Makefile for what it covers rather than trusting an enumeration here.
      # (This comment used to list those extra paths; the list went stale the next
      # time one was added, which is the failure mode an enumeration always has.)
      #
      # The comment before that claimed the two were the "same surface" and cited
      # Makefile:19-20, which is inside the lock-check comment block, not the lint
      # recipe. Narrower fails safe -- CI still lints everything, so the worst case
      # is a lint finding arriving at push time instead of commit time -- but the
      # stated reasoning was inverted, and a reader trusting it would have believed
      # a clean pre-commit run meant a clean `make lint`. It does not.
      - id: ruff-format
        files: '^(src|tests)/.*\.py$'
      - id: ruff
        args: [--fix]
        files: '^(src|tests)/.*\.py$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan of staged changes)
        # Matches the CI gate's intent at the diff layer: redact any match in
        # output, never print a raw secret to a terminal or log; no mute.

  - repo: local
    hooks:
      # mypy --strict is slow enough that it belongs at pre-push, not on every
      # commit. Runs via `uv run` in the project's own managed environment
      # (`language: system`) rather than pre-commit's isolated per-hook venv:
      # mypy needs the real dependency closure (cryptography, pillow, piexif,
      # reportlab, playwright, asn1crypto...) to resolve imports, and
      # `additional_dependencies:` would just re-duplicate uv.lock by hand.
      - id: mypy
        name: mypy --strict (pre-push, uv-managed env)
        stages: [pre-push]
        language: system
        entry: uv run mypy
        pass_filenames: false
        always_run: true

      - id: no-bare-todo-fixme-hack
        name: no bare TODO/FIXME/HACK (must reference an issue, e.g. TODO(#142))
        language: pygrep
        entry: '(TODO|FIXME|HACK)(?!\(#\d)'
        files: '^(src|tests|app|scripts)/.*\.(py|js)$'
      - id: no-bare-noqa-type-ignore
        name: no noqa/type:ignore without an explicit rule code
        language: pygrep
        entry: '(# ?noqa(?!: ?[A-Z]+\d)|# ?type: ?ignore(?!\[))'
        files: '^(src|tests|scripts)/.*\.py$'
